global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: teamora-api
    metrics_path: /metrics
    static_configs:
      - targets: ["api:8000"]
  - job_name: teamora-voice-gateway
    metrics_path: /metrics
    static_configs:
      - targets: ["voice-gateway:8787"]
