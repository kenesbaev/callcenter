worker_processes auto;
pid /tmp/nginx.pid;

events { worker_connections 1024; }

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  server_tokens off;
  client_max_body_size 10m;

  log_format json escape=json '{"time":"$time_iso8601","request_id":"$request_id","method":"$request_method","uri":"$uri","status":$status,"duration":$request_time}';
  access_log /var/log/nginx/access.log json;

  map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
  }

  upstream web_upstream { server web:3000; }
  upstream api_upstream { server api:8000; }
  upstream gateway_upstream { server voice-gateway:8787; }

  server {
    listen 8080;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "camera=(), geolocation=(), payment=(), microphone=(self)" always;
    add_header Content-Security-Policy "default-src 'self'; connect-src 'self' wss:; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'; font-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    location = /healthz { access_log off; return 200 'ok'; add_header Content-Type text/plain; }
    location /api/ { proxy_pass http://api_upstream; proxy_set_header Host $host; proxy_set_header X-Request-ID $request_id; proxy_set_header X-Forwarded-Proto $scheme; }
    location /gateway/ { proxy_pass http://gateway_upstream/; proxy_http_version 1.1; proxy_set_header Upgrade $http_upgrade; proxy_set_header Connection $connection_upgrade; proxy_set_header X-Request-ID $request_id; }
    location / { proxy_pass http://web_upstream; proxy_set_header Host $host; proxy_set_header X-Request-ID $request_id; proxy_set_header X-Forwarded-Proto $scheme; }
  }
}
